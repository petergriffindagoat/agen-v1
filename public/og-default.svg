<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <!-- Background -->
  <rect width="1200" height="630" fill="#F5F2ED"/>

  <!-- Brand accent line -->
  <rect x="0" y="0" width="8" height="630" fill="#E0592A"/>

  <!-- Logo mark -->
  <g transform="translate(80, 80)">
    <rect width="80" height="80" rx="12" fill="#E0592A"/>
    <path d="M30 30 L50 70 L70 30" stroke="#F5F2ED" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="50" cy="78" r="3" fill="#F5F2ED"/>
  </g>

  <!-- Text content -->
  <text x="80" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="400" fill="#1A1A1A" letter-spacing="-1">
    Perpetual Stack
  </text>

  <text x="80" y="310" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="300" fill="#5C5852">
    AI automation that ships to production
  </text>

  <!-- Bottom accent -->
  <rect x="80" y="530" width="120" height="4" fill="#E0592A"/>

  <!-- Domain -->
  <text x="80" y="570" font-family="monospace" font-size="20" fill="#8A857D" letter-spacing="1">
    perpetualstack.com
  </text>
</svg>
