<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <radialGradient id="og-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#121212"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#og-bg)"/>

  <!-- Impossible Depth Mark — S1=180, 46% inner scale, 8% upper-right offset, 1/12 stroke -->
  <g transform="translate(140, 65)">
    <!-- Outer square -->
    <rect x="160" y="160" width="180" height="180"
          stroke="#4F46E5" stroke-width="15" stroke-linejoin="miter" stroke-linecap="square"/>
    <!-- Inner square -->
    <rect x="223" y="194.2" width="82.8" height="82.8"
          stroke="#4F46E5" stroke-width="15" stroke-linejoin="miter" stroke-linecap="square"/>
    <!-- Diagonal: top-left corners -->
    <line x1="160" y1="160" x2="223" y2="194.2"
          stroke="#4F46E5" stroke-width="15" stroke-linecap="butt"/>
    <!-- Diagonal: top-right corners -->
    <line x1="340" y1="160" x2="305.8" y2="194.2"
          stroke="#4F46E5" stroke-width="15" stroke-linecap="butt"/>
    <!-- Diagonal: bottom-right corners (bottom-left intentionally absent) -->
    <line x1="340" y1="340" x2="305.8" y2="277"
          stroke="#4F46E5" stroke-width="15" stroke-linecap="butt"/>

    <!-- Wordmark — aligned to inner square optical centre -->
    <text x="610" y="235.6"
          font-family="Inter, -apple-system, sans-serif"
          font-weight="600" font-size="64" fill="#F4F4F9"
          letter-spacing="0.01em" dominant-baseline="middle">
      Perpetual Stack
    </text>
    <!-- Sub-tagline -->
    <text x="610" y="295.6"
          font-family="'JetBrains Mono', monospace"
          font-size="16" font-weight="700" fill="#818CF8"
          letter-spacing="0.2em">
      PRODUCTION-GRADE AUTONOMOUS SYSTEMS
    </text>
  </g>
</svg>
