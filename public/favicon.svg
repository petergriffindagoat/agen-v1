<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Outer square -->
  <rect x="3" y="3" width="26" height="26"
        stroke="#4F46E5" stroke-width="2.17" stroke-linejoin="miter" stroke-linecap="square"/>
  <!-- Inner square (46% scale, 8% upper-right offset) -->
  <rect x="12.1" y="7.94" width="11.96" height="11.96"
        stroke="#4F46E5" stroke-width="2.17" stroke-linejoin="miter" stroke-linecap="square"/>
  <!-- Diagonal: top-left corners -->
  <line x1="3" y1="3" x2="12.1" y2="7.94"
        stroke="#4F46E5" stroke-width="2.17" stroke-linecap="butt"/>
  <!-- Diagonal: top-right corners -->
  <line x1="29" y1="3" x2="24.06" y2="7.94"
        stroke="#4F46E5" stroke-width="2.17" stroke-linecap="butt"/>
  <!-- Diagonal: bottom-right corners (bottom-left intentionally absent) -->
  <line x1="29" y1="29" x2="24.06" y2="19.9"
        stroke="#4F46E5" stroke-width="2.17" stroke-linecap="butt"/>
</svg>
